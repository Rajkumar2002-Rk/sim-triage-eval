name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Unit and pinned regression tests
        run: uv run pytest -q
      - name: Offline report (no network, no secrets)
        # Gates on the frozen final version once recorded runs are committed.
        run: |
          if [ -f runs/final/VERSION ]; then
            v=$(cat runs/final/VERSION)
            uv run simtriage report --version "$v" --split test --json "report/$v-test.json"
            uv run simtriage report --version "$v" --split all \
              --metric label_free_mutation_recall --fail-under "$(cat runs/final/FAIL_UNDER)"
          else
            echo "no recorded runs committed yet; skipping report gate"
          fi
