name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Unit and pinned regression tests
        run: uv run pytest -q
      - name: Offline report (no network, no secrets)
        # Gates on the frozen final version once recorded runs are committed.
        run: |
          for ds in sim k8s; do
            if [ -f "runs/$ds/FINAL" ]; then
              v=$(cat "runs/$ds/FINAL")
              uv run simtriage report --dataset "$ds" --version "$v" --split test --json "report/$ds-$v-test.json"
              uv run simtriage report --dataset "$ds" --version "$v" --split all \
                --metric label_free_mutation_recall --fail-under "$(cat "runs/$ds/FAIL_UNDER")"
            else
              echo "$ds: no recorded runs committed yet; skipping report gate"
            fi
          done
