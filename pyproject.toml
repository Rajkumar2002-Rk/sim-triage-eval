[project]
name = "simtriage"
version = "0.1.0"
description = "Deterministic regression suite for a Sim issue-triage workflow, measured against Sim's Evaluator block"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7", "httpx>=0.27"]

[project.scripts]
simtriage = "simtriage.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simtriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
